<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         BASIC
    ========================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- =========================================
         SEO
    ========================================== -->

    <title>Soko</title>

    <meta
      name="description"
      content="Discover businesses, products and services with Soko."
    />

    <meta
      name="author"
      content="Soko"
    />

    <!-- =========================================
         THEME
    ========================================== -->

    <meta
      name="theme-color"
      content="#DE6536"
    />

    <meta
      name="application-name"
      content="Soko"
    />

    <!-- =========================================
         PWA
    ========================================== -->

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Soko"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="msapplication-TileColor"
      content="#DE6536"
    />

    <!-- =========================================
         ICONS
    ========================================== -->

    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />

    <!-- =========================================
         INITIAL LOADER
    ========================================== -->

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }

      body {
        background: #ffffff;
      }

      .app-loader {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        min-height: 100vh;
      }

      .loader {
        position: relative;
        width: 64px;
        height: 64px;
      }

      .loader div {
        position: absolute;
        top: 50%;
        left: 50%;

        width: 6px;
        height: 18px;

        margin-left: -3px;
        margin-top: -32px;

        border-radius: 999px;

        background: #de6536;

        transform-origin: center 32px;

        animation: fade 1.2s linear infinite;
      }

      .loader div:nth-child(1) {
        transform: rotate(0deg);
        animation-delay: -1.1s;
      }

      .loader div:nth-child(2) {
        transform: rotate(30deg);
        animation-delay: -1s;
      }

      .loader div:nth-child(3) {
        transform: rotate(60deg);
        animation-delay: -.9s;
      }

      .loader div:nth-child(4) {
        transform: rotate(90deg);
        animation-delay: -.8s;
      }

      .loader div:nth-child(5) {
        transform: rotate(120deg);
        animation-delay: -.7s;
      }

      .loader div:nth-child(6) {
        transform: rotate(150deg);
        animation-delay: -.6s;
      }

      .loader div:nth-child(7) {
        transform: rotate(180deg);
        animation-delay: -.5s;
      }

      .loader div:nth-child(8) {
        transform: rotate(210deg);
        animation-delay: -.4s;
      }

      .loader div:nth-child(9) {
        transform: rotate(240deg);
        animation-delay: -.3s;
      }

      .loader div:nth-child(10) {
        transform: rotate(270deg);
        animation-delay: -.2s;
      }

      .loader div:nth-child(11) {
        transform: rotate(300deg);
        animation-delay: -.1s;
      }

      .loader div:nth-child(12) {
        transform: rotate(330deg);
        animation-delay: 0s;
      }

      @keyframes fade {
        0% {
          opacity: 1;
        }

        100% {
          opacity: .15;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-loader">
        <div class="loader">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
